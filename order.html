<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Funky Fish</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="main-header">
    <div class="container header-inner">
      <div class="logos">
        <a href="index.html" class="logo-primary">
          <img src="images/fish logo.jpg" alt="Funky Fish Logo">
          <span>Funky Fish</span>
        </a>
        <a href="dogwash.html" class="logo-secondary">
          <img src="images/dog wash logo.jpg" alt="Wash & Wag Logo">
        </a>
      </div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Fishing Shop</a>
        <a href="dogwash.html">Dog Wash</a>
        <a href="contact.html">Contact</a>
        <a href="order.html" class="cart-btn active">Basket (<span id="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <section class="container checkout-section">
    <div class="checkout-layout">
      <div class="checkout-form">
        <h2>Your Details</h2>
        <form id="checkout-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="John Smith">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required placeholder="07123 456789">
          </div>
          
          <h2>Delivery Method</h2>
          <div class="radio-group">
            <label><input type="radio" name="delivery" value="collect" checked> Click & Collect (Free)</label>
            <label><input type="radio" name="delivery" value="delivery"> Local Delivery (Free within 2 miles)</label>
          </div>
          
          <div class="form-group" id="address-group" style="display: none;">
            <label for="address">Delivery Address</label>
            <textarea id="address" rows="3" placeholder="123 Fishing Lane..."></textarea>
          </div>

          <h2>Payment Method</h2>
          <div class="radio-group">
            <label><input type="radio" name="payment" value="card" checked> Credit / Debit Card</label>
            <label><input type="radio" name="payment" value="bank"> Bank Transfer</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Place Order</button>
        </form>
      </div>

            <div class="checkout-summary">
        <h2>Order Summary</h2>
        <div id="cart-items">
          <!-- Cart items will be injected here with +/- buttons -->
        </div>
        <div class="summary-total">
          <strong>Total:</strong>
          <strong id="cart-total">£0.00</strong>
        </div>
      </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2024 Funky Fish & Wash & Wag. All rights reserved.</p>
    </div>
  </footer>
  <!-- Toast Notification Container -->
  <div id="toast" class="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
